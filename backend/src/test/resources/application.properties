spring.application.name=pulsewatch-test
spring.datasource.url=jdbc:h2:mem:pulsewatch-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Tests drive checks by hand, so the background scheduler and demo data stay off.
pulsewatch.scheduler.enabled=false
pulsewatch.demo.enabled=false
pulsewatch.probe.timeout-ms=1000
pulsewatch.retention-days=7
