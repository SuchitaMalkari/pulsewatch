spring.application.name=pulsewatch
server.port=8080

# PostgreSQL by default. Override with environment variables; the defaults match docker-compose.yml (local dev only).
spring.datasource.url=${PULSEWATCH_DB_URL:jdbc:postgresql://localhost:5432/pulsewatch}
spring.datasource.username=${PULSEWATCH_DB_USER:pulsewatch}
spring.datasource.password=${PULSEWATCH_DB_PASSWORD:pulsewatch}

# Flyway owns the schema; Hibernate never changes it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# PulseWatch settings
pulsewatch.scheduler.enabled=true
pulsewatch.scheduler.tick-ms=1000
pulsewatch.scheduler.threads=8
pulsewatch.probe.timeout-ms=5000
pulsewatch.retention-days=7
pulsewatch.demo.enabled=true
